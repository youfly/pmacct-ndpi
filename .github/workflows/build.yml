name: Auto Build pmacct-nDPI (Smart)

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 【修复点 1】设置 QEMU：让 amd64 的 Runner 能模拟编译 arm64
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 【修复点 2 · 核心】设置 Buildx：创建 docker-container 驱动的 builder
      # 没有这一步，cache-to 和多平台构建都会报错！
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get upstream versions
        id: versions
        run: |
          PMACCT_COMMIT=$(git ls-remote https://github.com/pmacct/pmacct.git HEAD | awk '{print $1}' | cut -c1-7)
          echo "pmacct_tag=$PMACCT_COMMIT" >> $GITHUB_OUTPUT
          echo "date_tag=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Check if upstream changed
        id: check
        run: |
          IMAGE_PATH="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pmacct-${{ steps.versions.outputs.pmacct_tag }}"
          if docker manifest inspect $IMAGE_PATH > /dev/null 2>&1; then
            echo "upstream_changed=false" >> $GITHUB_OUTPUT
            echo "✅ Upstream not changed. Skipping build."
          else
            echo "upstream_changed=true" >> $GITHUB_OUTPUT
            echo "🚀 Upstream updated! Starting build."
          fi

      - name: Extract metadata
        id: meta
        if: steps.check.outputs.upstream_changed == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.versions.outputs.date_tag }}
            type=raw,value=pmacct-${{ steps.versions.outputs.pmacct_tag }}

      - name: Build and push Docker image
        if: steps.check.outputs.upstream_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
