name: Auto Build pmacct-nDPI (Smart)

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制重新构建（即使没有任何变化）'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 【修复 1】：使用 ** 递归匹配和明确文件名，防止 hashFiles 返回空值
      - name: Compute build context hash
        id: ctx
        run: |
          RAW_HASH="${{ hashFiles('**/Dockerfile', '**/cleanup.sh', '**/entrypoint.sh') }}"
          if [ -z "$RAW_HASH" ]; then
            echo "⚠️ WARNING: hashFiles returned empty! Check if Dockerfile and .sh files exist in the repo."
            CTX_HASH="empty"
          else
            CTX_HASH=$(echo "$RAW_HASH" | cut -c1-8)
          fi
          echo "hash=$CTX_HASH" >> $GITHUB_OUTPUT
          echo "📦 Raw hash: $RAW_HASH"
          echo "📦 Short hash (used in tag): $CTX_HASH"

      - name: Get upstream pmacct version
        id: versions
        run: |
          PMACCT_COMMIT=$(git ls-remote https://github.com/pmacct/pmacct.git HEAD | awk '{print $1}' | cut -c1-7)
          echo "pmacct_tag=$PMACCT_COMMIT" >> $GITHUB_OUTPUT
          echo "date_tag=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      # 【修复 2】：使用 buildx imagetools 替代 docker manifest，并增加详细日志
      - name: Check if rebuild needed
        id: check
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "need_build=true" >> $GITHUB_OUTPUT
            echo "⚡ Force rebuild requested."
            exit 0
          fi
          
          TARGET_TAG="pmacct-${{ steps.versions.outputs.pmacct_tag }}-ctx-${{ steps.ctx.outputs.hash }}"
          IMAGE_PATH="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TARGET_TAG}"
          
          echo "🔍 Checking existence of target image: $IMAGE_PATH"
          
          # 使用 buildx imagetools inspect，对 registry 认证支持更好，不会静默误判
          if docker buildx imagetools inspect "$IMAGE_PATH" > /dev/null 2>&1; then
            echo "need_build=false" >> $GITHUB_OUTPUT
            echo "✅ Image already exists in registry. Skipping build."
          else
            echo "need_build=true" >> $GITHUB_OUTPUT
            echo "🚀 Image not found in registry. Starting build."
          fi

      - name: Extract metadata
        id: meta
        if: steps.check.outputs.need_build == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.versions.outputs.date_tag }}
            type=raw,value=pmacct-${{ steps.versions.outputs.pmacct_tag }}-ctx-${{ steps.ctx.outputs.hash }}

      - name: Build and push Docker image
        if: steps.check.outputs.need_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
