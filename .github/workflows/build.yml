name: Build pmacct with nDPI

on:
  workflow_dispatch:  # 允许在 GitHub 界面手动触发
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # 允许推送到 ghcr.io

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 QEMU (用于模拟 ARM64 架构)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. 设置 Docker Buildx (用于多架构构建)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. 登录 GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. 构建并推送镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 如果只需 x86 架构，可删除 linux/arm64 以加快速度
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/pmacct-ndpi:latest
          # 启用缓存加速后续构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
